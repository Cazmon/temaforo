                        style="font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 17.33px; line-height: 8px; text-transform: uppercase; color: #47241C; text-shadow: none;">TIENDA</span>

<script>
    (function () {
        let lastHash = "";

        // El pie de Discourse se renderiza con Ember y descarta las etiquetas <script>, asi que la
        // logica del cartel de la IP (copiar + contador) vive aqui, en el script de la cabecera.
        const SD_IP = "mc.survivaldub.com";
        function sdCountUp(el, n) {
            let start = null;
            const dur = 1500;
            function step(ts) {
                if (start === null) start = ts;
                const p = Math.min((ts - start) / dur, 1);
                el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
        function sdFetchPlayers(el, animate) {
            fetch('https://api.mcstatus.io/v2/status/java/' + SD_IP)
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (!d || !d.online) return;
                    const n = (d.players && d.players.online) || 0;
                    if (animate) sdCountUp(el, n); else el.textContent = n;
                })
                .catch(() => { });
        }
        function ensureFooterBanner() {
            const banner = document.getElementById('ip-footer-banner');
            if (!banner || banner.dataset.sdBound) return;
            banner.dataset.sdBound = '1';

            let busy = false;
            function copy() {
                if (busy) return;
                busy = true;
                try { navigator.clipboard.writeText(SD_IP); } catch (e) { }
                const t = document.getElementById('ip-text-val');
                const sub = document.getElementById('count-val');
                const oldSub = sub.innerHTML;
                t.textContent = '¡IP COPIADA!';
                t.style.color = '#57F287';
                sub.textContent = '¡TE ESPERAMOS DENTRO!';
                sub.style.color = '#FFFFFF';
                setTimeout(() => {
                    t.textContent = SD_IP;
                    t.style.color = '';
                    sub.innerHTML = oldSub;
                    sub.style.color = '';
                    busy = false;
                }, 3000);
            }
            banner.addEventListener('click', copy);
            banner.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
            });

            const first = document.getElementById('sd-ip-count');
            if (first) sdFetchPlayers(first, true);
            setInterval(() => {
                const el = document.getElementById('sd-ip-count');
                if (el) sdFetchPlayers(el, false);
            }, 120000);
        }

        function sync() {
            ensureFooterBanner();
            const dLogo = document.querySelector('.logo-big') || document.querySelector('.logo-small') || document.querySelector('#site-logo');
            if (dLogo && dLogo.src) {
                // Discourse tiene como hostname "localhost" y su logo sale como https://localhost/uploads/...
                // (roto). Nos quedamos solo con la ruta para que se resuelva contra el dominio real.
                let logoPath = dLogo.getAttribute('src') || dLogo.src;
                try { const u = new URL(dLogo.src, location.origin); logoPath = u.pathname + u.search; } catch (e) { }
                const myLogos = document.querySelectorAll('.sd-dynamic-logo');
                myLogos.forEach(img => { if (img.getAttribute('src') !== logoPath) img.setAttribute('src', logoPath); });
            }

            const bh = document.querySelector('.b-header') || document.querySelector('.brand-header');
            if (!bh) return;
            const nav = bh.querySelector('nav');
            const icons = bh.querySelector('.icons');
            const tNav = document.getElementById('sd-dynamic-nav');
            const tS = document.getElementById('sd-store-header');

            const currentHash = (nav ? nav.innerHTML : '') + (icons ? icons.innerHTML : '');
            if (currentHash === lastHash) return;
            lastHash = currentHash;

            if (nav && tNav) {
                const links = nav.querySelectorAll('a');
                if (links.length > 0) {
                    const frag = document.createDocumentFragment();
                    links.forEach(l => {
                        const nl = l.cloneNode(true);
                        nl.className = 'nav-link group relative font-extrabold text-[15px] uppercase text-white tracking-wide transition-all duration-200 hover:text-yellow-300 hover:scale-110';
                        nl.style.cssText = 'position: relative; font-weight: 800; font-size: 15px; text-transform: uppercase; color: white; letter-spacing: 0.025em; transition: all 0.2s; text-shadow: 2px 2px 0 rgba(0,0,0,0.4); text-decoration: none;';
                        const span = document.createElement('span');
                        span.className = 'absolute -bottom-1 left-0 w-0 h-[3px] bg-yellow-300 group-hover:w-full transition-all duration-200 rounded-full shadow-[0_0_8px_rgba(253,224,71,0.6)]';
                        span.style.cssText = 'position: absolute; bottom: -4px; left: 0; width: 0; height: 3px; background: #FDE047; border-radius: 9999px; box-shadow: 0 0 8px rgba(253, 224, 71, 0.6); transition: width 0.2s;';
                        nl.appendChild(span);
                        nl.addEventListener('mouseenter', function () { this.style.color = '#FDE047'; this.style.transform = 'scale(1.1)'; span.style.width = '100%'; });
                        nl.addEventListener('mouseleave', function () { this.style.color = 'white'; this.style.transform = 'scale(1)'; span.style.width = '0'; });
                        frag.appendChild(nl);
                    });
                    tNav.innerHTML = '';
                    tNav.appendChild(frag);
                }
            }
            if (icons && tS) {
                icons.querySelectorAll('a').forEach(l => {
                    const h = (l.getAttribute('href') || '').toLowerCase();
                    if (h.includes('tienda') || h.includes('shop') || h.includes('store')) tS.setAttribute('href', l.getAttribute('href'));
                });
            }

            // --- MOVER ICONOS DE DISCOURSE (USER, CHAT, SEARCH) ---
            const panel = document.getElementById('sd-discourse-panel');
            if (panel) {
                const userMenu = document.querySelector('li#current-user.header-dropdown-toggle');
                const chatIcon = document.querySelector('.header-dropdown-toggle.chat-header-icon');
                const searchIcon = document.querySelector('.header-dropdown-toggle.search-dropdown');

                [searchIcon, chatIcon, userMenu].forEach(icon => {
                    if (icon && icon.parentElement !== panel) {
                        // Limpiar estilos nativos que puedan molestar
                        icon.style.display = 'block';
                        icon.style.visibility = 'visible';
                        icon.style.listStyle = 'none';
                        panel.appendChild(icon);
                    }
                });
            }
        }
        const obs = new MutationObserver(sync);
        obs.observe(document.body, { childList: true, subtree: true });
        sync();
        setInterval(sync, 4000);
    })();
</script>
